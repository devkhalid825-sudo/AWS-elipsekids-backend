# /etc/nginx/sites-available/elipse-kids-api
# Replace api.yourdomain.com with the real subdomain (DNS A record -> your VPS IP).
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Videos can be large: allow uploads up to 500 MB (matches the backend limit)
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
# After this works, run:  sudo certbot --nginx -d api.yourdomain.com   (adds HTTPS)
